name: Release

# Publish a versioned release tarball whenever a vX.Y.Z tag is pushed.
# The recovery image build (buildroot-recovery-build) fetches this asset by
# version — see package/jrescue-app/jrescue-app.mk there.
#
# The git tag is the ONLY place the version lives: this workflow stamps it
# into core/config.py (APP_VERSION) while building the tarball. In a git
# checkout APP_VERSION stays "dev".
#
# Tags may live on any branch: normal releases are tagged on master; hotfix
# releases for an older line are tagged on a branch cut from the old tag
# (e.g. `git checkout -b hotfix/1.3.x v1.3.4`). Hotfix releases are built
# the same way but are NOT marked "Latest" and do not touch master's README.
#
# To cut a release:
#   commit everything, then: git tag vX.Y.Z && git push origin <branch> vX.Y.Z
#
# For a release tagged on master, the `bump-recipe` job then bumps
# JRESCUE_APP_VERSION in buildroot-recovery-build's jrescue-app.mk automatically
# (mirrors the bump-tools job over there). It needs a BUILDROOT_BUMP_TOKEN secret
# — a token with contents:write on jethome-iot/buildroot-recovery-build.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      on_master: ${{ steps.ancestry.outputs.on_master }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history — needed to check tag ancestry vs master

      - name: Check whether the tag is on master
        id: ancestry
        run: |
          git fetch origin master
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Build release tarball (version stamped from the tag)
        run: |
          v="${GITHUB_REF_NAME#v}"
          pkg="jrescue-app-$v"
          mkdir -p "dist/$pkg"
          # Ship only the runtime components buildroot installs.
          cp -a core console-application oled-grid-application web-application "dist/$pkg/"
          # Stamp the release version into the shipped config (repo keeps "dev").
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$v\"/" "dist/$pkg/core/config.py"
          grep -n '^APP_VERSION' "dist/$pkg/core/config.py"
          find "dist/$pkg" -name '__pycache__' -type d -prune -exec rm -rf {} +
          tar -C dist -czf "$pkg.tar.gz" "$pkg"
          # Publish a checksum next to the tarball so on-device jrescue-update
          # can verify the download before swapping the live app.
          sha256sum "$pkg.tar.gz" | tee "$pkg.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hotfix releases from old lines must not steal the "Latest" badge.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest=${{ steps.ancestry.outputs.on_master }} \
            jrescue-app-*.tar.gz jrescue-app-*.tar.gz.sha256

      - name: Update current version in README (commit to master)
        if: steps.ancestry.outputs.on_master == 'true'
        run: |
          git checkout -B master origin/master
          sed -i -E "s|^\*\*Current version:\*\* v.*|**Current version:** ${GITHUB_REF_NAME}|" README.md
          if git diff --quiet README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "README: current version ${GITHUB_REF_NAME}" README.md
          git push origin master

  bump-recipe:
    needs: release
    if: needs.release.outputs.on_master == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      RECIPE: buildroot-external/package/jrescue-app/jrescue-app.mk
      BR_BRANCH: main
    steps:
      - name: Check out buildroot-recovery-build
        uses: actions/checkout@v7
        with:
          repository: jethome-iot/buildroot-recovery-build
          ref: main
          token: ${{ secrets.BUILDROOT_BUMP_TOKEN }}
          path: buildroot-recovery-build

      - name: Bump JRESCUE_APP_VERSION
        working-directory: buildroot-recovery-build
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          ver="${TAG#v}"
          sed -i "s|^JRESCUE_APP_VERSION = .*|JRESCUE_APP_VERSION = $ver|" "$RECIPE"
          grep -qx "JRESCUE_APP_VERSION = $ver" "$RECIPE" \
            || { echo "::error::JRESCUE_APP_VERSION not rewritten"; exit 1; }

      - name: Commit and push
        working-directory: buildroot-recovery-build
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "recipe already at $TAG, nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "jrescue-app: bump to ${TAG#v}"
          git push origin "HEAD:$BR_BRANCH"
